[package]
name = "cliptray"
version = "0.1.0"
description = "Native Menu Bar Clipboard Manager for macOS, Windows, and Linux"
authors = ["Antigravity Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
regex = "1.10"
window-vibrancy = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = { version = "0.2", default-features = true }

